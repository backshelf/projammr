name: Bug report
description: Something in Projammr does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag (for example `v1.2.0`), or the commit if you built from source.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you run it
      options:
        - Published Docker images
        - Built from source with Docker
        - Development checkout (`bun run dev`)
        - dit download
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name and version. For a browser problem, include the browser too.
      placeholder: macOS 15.2, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Output of `docker compose logs api web`, dit's log, or the browser console, whichever applies.
        Remove anything private first.
      render: shell
