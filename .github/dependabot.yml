version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # tauri's crates and @tauri-apps' packages must share a minor, or `tauri
    # build` refuses: bump them together by hand.
    ignore:
      - dependency-name: "tauri*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@tauri-apps/*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /packages/dit
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /apps/dit-app/src-tauri
    schedule:
      interval: monthly
    # tauri's crates and @tauri-apps' packages must share a minor, or `tauri
    # build` refuses: bump them together by hand.
    ignore:
      - dependency-name: "tauri*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@tauri-apps/*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
