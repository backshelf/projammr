name: E2E

# Not on pull requests: a browser run is too dear for every push to one. It
# runs for a release, and by hand when a change wants it.
on:
  # `release.yml` calls this ahead of publishing, so a pushed tag needs no
  # trigger of its own.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Bun and the dependencies, without the Rust toolchain: the images build
      # the WebAssembly themselves.
      - uses: ./.github/actions/setup
        with:
          dsp: "false"
      - uses: docker/setup-buildx-action@v4
      # Builds both targets from the compose files, reading any layers an
      # earlier run cached under the same scopes.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.build.yml
          targets: |
            api
            web
          load: true
          set: |
            *.args.SOURCE_REVISION=${{ github.sha }}
            api.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
      # A fresh stack every run: the suite's first spec signs up the instance
      # admin, and the first sign-up is the only one an instance accepts.
      - run: bun apps/e2e/src/stack.ts up
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: bun run test:e2e
        working-directory: apps/e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore
      - name: Stack logs
        if: failure()
        run: bun apps/e2e/src/stack.ts logs
      - name: Stack down
        if: always()
        run: bun apps/e2e/src/stack.ts down
