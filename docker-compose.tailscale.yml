# Serves the stack from a Tailscale node instead of the Caddy proxy. Layered
# over docker-compose.yml, most simply by naming both in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tailscale.yml
#
# Building the images from source adds docker-compose.build.yml to that list:
# COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml:docker-compose.tailscale.yml
#
# The node is named after PUBLIC_HOST, which has to be the node's full
# MagicDNS name (<name>.<tailnet>.ts.net), and serves it over HTTPS under a
# publicly trusted certificate Tailscale issues, so no device has a CA to
# trust. Funnel makes it reachable from the internet as well as the tailnet
# (`tailscale-serve.json`'s `AllowFunnel`).
services:
  # Not started: `caddy` is a profile no plain `up` activates.
  proxy:
    profiles: ["caddy"]

  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # Only read the first time the node logs in; the login then lives in
      # the state volume, so the key can be single-use and expire afterwards.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      # The Caddyfile's routes: serve strips a mount's path and appends the
      # rest to its target's, so `/media/x` reaches the API as `/static/x`.
      # It sets X-Forwarded-For to the caller's own address, Funnel's public
      # callers included, rather than appending to it, so one hop is still
      # the whole chain and TRUSTED_PROXY_HOPS keeps its default of 1.
      # Tailscale substitutes the node's own name for ${TS_CERT_DOMAIN}.
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
    # The node takes PUBLIC_HOST's first label as its name, so the name it
    # serves under is the one every derived URL was built from.
    command:
      - sh
      - -c
      - |
        case "$$PUBLIC_HOST" in
          *.ts.net) ;;
          *) echo "PUBLIC_HOST must be the node's MagicDNS name, <name>.<tailnet>.ts.net; it is '$$PUBLIC_HOST'" >&2; exit 1 ;;
        esac
        TS_HOSTNAME="$${PUBLIC_HOST%%.*}" exec containerboot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes:
      # The node's identity and login; losing it means logging in again with
      # a fresh key, and the tailnet may then name the node `<name>-1`.
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

  api:
    environment:
      # Tailscale's certificate is publicly trusted, so HSTS is safe to send.
      TLS_MODE: acme

volumes:
  tailscale-state:
