[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gethostname = "1.1.0"
hex = "0.4.3"
keyring-core = "1.0.0"
libc = "0.2.189"
libz-sys = "1.1.29"
quick-xml = "0.42.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
# `ring` is the crypto provider `ureq` is handed; the crate is otherwise ureq's own TLS stack.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3"
thiserror = "2.0.21"
toml = "1.1.6"
# Certificates verify against the system trust store only (`platform-verifier`); no bundled root set is linked.
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
zstd = "0.14.0"

# The wasm module is size-bound; `panic = "abort"` is not set because a panic already traps on wasm32-unknown-unknown.
[profile.release.package.dit-wasm]
opt-level = "s"
codegen-units = 1
strip = true
