[package]
name = "dit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["store", "remote"]
# The filesystem object store and repo, with zstd compression: C code and host access the wasm build leaves out.
store = ["dep:sha1", "dep:zstd", "dep:toml", "dep:gethostname", "dep:libc"]
# Signing in to an instance: the HTTP client, TLS, the keyring and the user config, none of which the wasm build links.
remote = [
  "dep:sha1",
  "dep:ureq",
  "dep:rustls",
  "dep:keyring-core",
  "dep:apple-native-keyring-store",
  "dep:dirs",
  "dep:toml",
  "dep:gethostname",
  "dep:getrandom",
]
# The scripted instance on a loopback port and the signed-in connection to it that the tests of everything talking to
# an instance use, for crates whose own tests do too.
test-support = ["remote"]

[dependencies]
dirs = { workspace = true, optional = true }
gethostname = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha1 = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
toml = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

# A store batch syncs each object with a plain `fsync` and flushes the drive's cache once (`F_FULLFSYNC`), where `std`'s
# `sync_all` would flush the cache for every file. The token store is the login Keychain.
[target.'cfg(target_vendor = "apple")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
