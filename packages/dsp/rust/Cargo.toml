[package]
name = "projammr_dsp"
version = "1.0.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
# `cdylib` is the WebAssembly module; `rlib` lets `cargo test` link the crate natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
ebur128 = "0.1"                                     # MIT, pure Rust port of libebur128
rubato = { version = "5", default-features = false } # MIT OR Apache-2.0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
